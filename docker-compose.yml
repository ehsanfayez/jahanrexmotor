services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: jahanrexanmotor_site
    container_name: jahanrexanmotor_site
    ports:
      - "${SITE_PORT:-8688}:80"
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.services.jahanrexanmotor.loadbalancer.server.port=80
      - traefik.http.routers.jahanrexanmotor.rule=Host(`${SITE_DOMAIN:-jahanrexanmotor.localhost}`)
      - traefik.http.routers.jahanrexanmotor.entrypoints=websecure
      - traefik.http.routers.jahanrexanmotor.tls.certresolver=letsencrypt
      - traefik.http.routers.jahanrexanmotor.service=jahanrexanmotor
      # Permanently redirect www to SITE_DOMAIN, keeping path and query.
      - traefik.http.middlewares.jahanrexanmotor-canonical.redirectregex.regex=^https?://[^/]+(.*)$$
      - traefik.http.middlewares.jahanrexanmotor-canonical.redirectregex.replacement=https://${SITE_DOMAIN:-jahanrexanmotor.localhost}$${1}
      - traefik.http.middlewares.jahanrexanmotor-canonical.redirectregex.permanent=true
      # Separate router: a failed certificate for www must not affect the main domain.
      - traefik.http.routers.jahanrexanmotor-www.rule=Host(`www.${SITE_DOMAIN:-jahanrexanmotor.localhost}`)
      - traefik.http.routers.jahanrexanmotor-www.entrypoints=websecure
      - traefik.http.routers.jahanrexanmotor-www.tls.certresolver=letsencrypt
      - traefik.http.routers.jahanrexanmotor-www.middlewares=jahanrexanmotor-canonical
      - traefik.http.routers.jahanrexanmotor-www.service=jahanrexanmotor

networks:
  proxy:
    name: ${DOCKER_NETWORK:-jahan}
    external: true
